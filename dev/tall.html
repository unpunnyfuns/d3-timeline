<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline: tall chart</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      h2 {
        font-size: 1rem;
        margin: 2rem 0 0.5rem;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .row .timeline {
        flex: 1;
        min-width: 0;
      }
      .controls {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }
      .controls label {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .kind-release {
        --timeline-bar-bg: #2f9e63;
        --timeline-bar-hover-bg: #237a4c;
      }
    </style>
  </head>
  <body>
    <nav><a href="/">playground</a> · <a href="/tall.html">tall chart</a></nav>
    <label class="theme">
      Theme
      <select id="theme">
        <option value="light dark">system</option>
        <option value="light">light</option>
        <option value="dark">dark</option>
      </select>
    </label>
    <h2>100 lanes with a lane map</h2>
    <div id="app"></div>
    <script type="module" src="/tall.tsx"></script>
  </body>
</html>
